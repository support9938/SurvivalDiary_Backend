spring:
  profiles:
    default: secret

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 정본은 Flyway 마이그레이션 — JPA가 DDL을 만들지 않는다
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@survivaldiary.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:1234}
  upload:
    profile-directory: ${PROFILE_IMAGE_DIRECTORY:uploads/profile}

jwt:
  # 환경변수 JWT_SECRET(Base64, 256bit 이상)으로 주입한다 — 기본값 없음, 미설정 시 기동 실패
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000      # 액세스 토큰 1시간
  refresh-token-validity-ms: 1209600000  # 리프레시 토큰 2주

oauth:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

policy:
  provider:
    base-url: https://www.youthcenter.go.kr
    # 온통청년에서 승인된 인증키를 환경변수로만 주입한다. 저장소에는 실제 값을 기록하지 않는다.
    api-key: ${YOUTH_POLICY_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    retry-count: ${YOUTH_POLICY_RETRY_COUNT:1}
    retry-delay: ${YOUTH_POLICY_RETRY_DELAY:300ms}
    cache-ttl: ${YOUTH_POLICY_CACHE_TTL:10m}
    stale-cache-ttl: ${YOUTH_POLICY_STALE_CACHE_TTL:1h}
    cache-max-entries: ${YOUTH_POLICY_CACHE_MAX_ENTRIES:128}

news:
  provider:
    base-url: https://naverapihub.apigw.ntruss.com
    # NAVER API HUB 뉴스 검색 인증정보는 네이버 로그인 키와 분리해 환경변수로 주입한다.
    client-id: ${NAVER_API_HUB_CLIENT_ID:}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}
    connect-timeout: 5s
    read-timeout: 10s
    cache-ttl: 1h
    display: 50
    pages-per-topic: 3


good-price:
  provider:
    base-url: https://api.odcloud.kr/api
    api-key: ${GOOD_PRICE_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s

public-facility:
  provider:
    base-url: https://api.data.go.kr
    # Prefer the dedicated key, then reuse the already configured public-data key.
    # The legacy directions key remains the last fallback for compatibility.
    api-key: ${PUBLIC_DATA_API_KEY:${real-estate-rent.provider.api-key:${public-facility.directions.app-key:}}}
    connect-timeout: 2s
    read-timeout: 10s
    page-size: 1000
    cache-ttl: 24h

public-parking:
  provider:
    base-url: https://api.data.go.kr
    api-key: ${PUBLIC_DATA_API_KEY:}
    connect-timeout: 2s
    read-timeout: 15s
    page-size: 1000
    cache-ttl: 24h

real-estate-rent:
  provider:
    base-url: https://apis.data.go.kr/1613000
    api-key: ${REAL_ESTATE_RENT_API_KEY:${GOOD_PRICE_API_KEY:}}
    connect-timeout: 2s
    read-timeout: 5s

naver-map:
  geocoding:
    base-url: https://maps.apigw.ntruss.com
    api-key-id: ${NAVER_MAP_API_KEY_ID:}
    api-key: ${NAVER_MAP_API_KEY:}
    connect-timeout: 2s
    read-timeout: 3s

tmap:
  directions:
    base-url: https://apis.openapi.sk.com
    app-key: ${TMAP_APP_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
