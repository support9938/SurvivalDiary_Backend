spring:
  profiles:
    default: secret

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 정본은 Flyway 마이그레이션 — JPA가 DDL을 만들지 않는다
    open-in-view: false

  flyway:
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  # 환경변수 JWT_SECRET(Base64, 256bit 이상)으로 주입한다 — 기본값 없음, 미설정 시 기동 실패
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000      # 액세스 토큰 1시간
  refresh-token-validity-ms: 1209600000  # 리프레시 토큰 2주

policy:
  provider:
    base-url: https://www.youthcenter.go.kr
    # 온통청년에서 승인된 인증키를 환경변수로만 주입한다. 저장소에는 실제 값을 기록하지 않는다.
    api-key: ${YOUTH_POLICY_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s


good-price:
  provider:
    base-url: https://api.odcloud.kr/api
    api-key: ${GOOD_PRICE_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s

naver-map:
  geocoding:
    base-url: https://maps.apigw.ntruss.com
    api-key-id: ${NAVER_MAP_API_KEY_ID:}
    api-key: ${NAVER_MAP_API_KEY:}
    connect-timeout: 2s
    read-timeout: 3s

tmap:
  directions:
    base-url: https://apis.openapi.sk.com
    app-key: ${TMAP_APP_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
